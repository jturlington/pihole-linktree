<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
    <title>{{.Domain}} LinkTree</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="60">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            padding: 2rem 1rem;
            margin-bottom: 4rem;
            /* Add space for footer */
        }

        .domain-card {
            background: #1a1a1a;
            border: 1px solid #333333;
            transition: transform 0.2s ease-in-out;
            margin-bottom: 1rem;
        }

        .domain-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        /* Updated selectors to target cards instead of links */
        .domain-card:nth-of-type(6n+1) .domain-link {
            color: #8ab4f8;
        }

        /* Light blue */
        .domain-card:nth-of-type(6n+2) .domain-link {
            color: #f28b82;
        }

        /* Soft red */
        .domain-card:nth-of-type(6n+3) .domain-link {
            color: #81c995;
        }

        /* Mint green */
        .domain-card:nth-of-type(6n+4) .domain-link {
            color: #fdd663;
        }

        /* Warm yellow */
        .domain-card:nth-of-type(6n+5) .domain-link {
            color: #c58af9;
        }

        /* Light purple */
        .domain-card:nth-of-type(6n+6) .domain-link {
            color: #ff9e64;
        }

        /* Soft orange */

        .domain-link:hover {
            opacity: 0.8;
            color: inherit;
            /* Keep the same color but slightly faded on hover */
        }

        .ip-address {
            color: #888888;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .page-title {
            color: #ffffff;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #333333;
        }

        /* Add footer styles */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            padding: 1rem;
            text-align: center;
            border-top: 1px solid #333333;
        }

        .footer a {
            color: #8ab4f8;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="page-title">{{.Domain}} LinkTree</h1>

        {{range .Subdomains}}
        <div class="card domain-card">
            <div class="card-body d-flex justify-content-between align-items-center">
                <a href="https://{{.Name}}" target="_blank" class="domain-link">{{.Title}}</a>
                <span class="ip-address">({{index .ARecords 0}})</span>
            </div>
        </div>
        {{end}}
    </div>

    <footer class="footer">
        <a href="https://github.com/jturlington/pihole-linktree" target="_blank">
            View on GitHub
        </a>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
